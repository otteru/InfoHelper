[build-system]
requires = ["setuptools>=82,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "info-helper"
version = "0.1.0"
description = "사용자 맞춤형 공지 수집 및 추천 이메일 서비스"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.40,<1.41",
    "crawl4ai>=0.9,<0.10",
    "google-genai>=2.10,<2.11",
    "langchain-core>=1.4,<1.5",
    "langchain-google-genai>=4.2,<4.3",
    "langgraph>=1.0,<1.1",
    "python-dotenv>=1.1,<1.2",
    "python-frontmatter>=1.3,<1.4",
    "requests>=2.32,<2.33",
    "supabase>=2.31,<2.32",
    "fastapi>=0.139,<0.140",
    "uvicorn>=0.51,<0.52",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<0.29",
    "mypy-boto3-sesv2>=1.43,<1.44",
    "pytest>=9.1,<9.2",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "ai_graphs*", "delivery*", "integrations*"]
namespaces = true
