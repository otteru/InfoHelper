name: PR 검증

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 Checkout
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 애플리케이션 의존성 설치
        run: python -m pip install ".[dev,evaluation]"

      - name: Python 문법 검사
        run: python -m compileall -q main.py ai_graphs delivery infra RAG_evaluation

      - name: 네트워크 요청 없는 테스트 실행
        run: >-
          pytest -q
          test/delivery
          test/recommendation_graph
          test/ingestion_graph

      # 라벨링 웹·pool 재생성은 gitignore된 로컬 산출물에 의존한다.
      # first_pass 테스트와 구현도 Git에 포함되지 않는 로컬 실험 도구다.
      - name: RAG 검색 및 벤치마크 테스트
        run: >-
          python -m pytest -q test/rag_evaluation
          --ignore=test/rag_evaluation/test_labeling.py
          --ignore=test/rag_evaluation/test_export_pool.py
          --ignore=test/rag_evaluation/test_first_pass.py

  pulumi-preview:
    name: Pulumi Preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 저장소 Checkout
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pulumi 의존성 설치
        working-directory: infra
        run: python -m pip install .

      - name: AWS 임시 인증
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PREVIEW_ROLE_ARN }}
          aws-region: us-east-1

      - name: Pulumi Preview
        uses: pulumi/actions@v7
        with:
          command: preview
          stack-name: dev
          work-dir: infra
          comment-on-pr: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

  supabase-migration-preview:
    name: Supabase Migration Preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 저장소 Checkout
        uses: actions/checkout@v4

      - name: Supabase CLI 설정
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 적용 예정 migration 확인
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push --linked --dry-run
