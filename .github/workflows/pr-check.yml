name: PR 검증

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 Checkout
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 애플리케이션 의존성 설치
        run: python -m pip install ".[dev]"

      - name: Python 문법 검사
        run: python -m compileall -q main.py ai_graphs delivery infra

      - name: 네트워크 요청 없는 테스트 실행
        run: >-
          pytest -q
          test/delivery
          test/recommendation_graph
          test/ingestion_graph

  pulumi-preview:
    name: Pulumi Preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 저장소 Checkout
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pulumi 의존성 설치
        working-directory: infra
        run: python -m pip install .

      - name: AWS 임시 인증
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PREVIEW_ROLE_ARN }}
          aws-region: us-east-1

      - name: Pulumi Preview
        uses: pulumi/actions@v7
        with:
          command: preview
          stack-name: dev
          work-dir: infra
          comment-on-pr: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
